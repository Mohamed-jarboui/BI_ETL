name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: bi_admin
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_admin -d ecommerce_dw"
          --health-interval 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/
      MONGO_DB: ecommerce
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: ecommerce_dw
      PG_USER: bi_admin
      PG_PASSWORD: ci_password
      RUN_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create warehouse schema
        run: PGPASSWORD=$PG_PASSWORD psql -h localhost -U $PG_USER -d $PG_DATABASE -v ON_ERROR_STOP=1 -f sql/schema.sql

      - name: Wait for MongoDB
        run: |
          python -c "
          import time, pymongo
          for _ in range(30):
              try:
                  pymongo.MongoClient('mongodb://localhost:27017/', serverSelectionTimeoutMS=1000).admin.command('ping'); break
              except Exception:
                  time.sleep(1)
          "

      - name: Run tests (unit + end-to-end ETL)
        run: pytest tests -v
