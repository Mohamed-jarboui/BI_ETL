version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_dw
    environment:
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: bi_admin
      POSTGRES_PASSWORD: bi_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - bi_network

volumes:
  postgres_data:

networks:
  bi_network:
    driver: bridge
